name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12"

      - name: Create venv and install deps
        run: uv sync --locked

      - name: Run tests with coverage
        run: |
          . .venv/bin/activate
          pytest tests/ -v --cov=tetris_game --cov-report=term-missing
